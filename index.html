<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Valley</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <div class="container header-container">
    <div class="header-text">
      <h1>Stone Valley</h1>
      <p>Natural Stones • Stone Furniture • Decorative Rocks</p>
    </div>
    <img src="images/logo-1.png" alt="Stone Valley Logo" class="logo">
  </div>
</header>

<nav>
  <div class="container nav-container">
    <a href="#about">About</a>
    <a href="#products">Products</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <h2>Bring Nature into Your Home</h2>
    <p>Beautiful Natural Stone Furniture, Decorative Rocks, and Landscaping Creations</p>
    <div class="hero-buttons">
      <a class="call-btn" href="tel:+918078199773">📞 Call Now</a>
      <a class="email-btn" href="mailto:stonevalley@zohomail.in">✉️ Email Us</a>
    </div>
  </div>
</section>

<!-- Gallery Section -->
<section id="gallery">
  <div class="container">
    <h2>Gallery</h2>
    <div class="gallery-grid" id="gallery-grid">
      <!-- Images will be loaded dynamically by JavaScript -->
    </div>
  </div>
</section>

<!-- Lightbox Overlay -->
<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="">
</div>

<footer>
  <div class="container">
    <p>© 2026 Stone Valley</p>
  </div>
</footer>

<!-- WhatsApp Button -->
<a href="https://wa.me/918078199773" class="whatsapp-btn" target="_blank">💬 WhatsApp</a>

<!-- Scripts -->
<script>
  // List your uploaded gallery images here (only uploaded images)
  const images = [
    "images/image-1.jpg",
    "images/image-2.jpg",
    "images/image-3.jpg",
    "images/image-4.jpg",
    "images/image-5.jpg",
    "images/image-6.jpg",
    "images/image-7.jpg",
    "images/image-8.jpg",
    "images/image-9.jpg",
    "images/image-10.jpg",
    "images/image-11.jpg",
    "images/image-12.jpg",
    "images/image-13.jpg",
    "images/image-14.jpg",
    "images/image-15.jpg",
    "images/image-16.jpg",
    "images/image-17.jpg",
    "images/image-18.jpg",
    "images/image-19.jpg",
    "images/image-20.jpg"
  ];

  const galleryGrid = document.getElementById('gallery-grid');

  images.forEach(src => {
    // Only add if the image exists
    const img = document.createElement('img');
    img.src = src;
    img.alt = "Stone Gallery";
    img.addEventListener('dblclick', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = src; // original resolution
    });
    galleryGrid.appendChild(img);
  });

  // Lightbox functionality
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  function closeLightbox() {
    lightbox.style.display = 'none';
  }
</script>

</body>
</html>
